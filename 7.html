
<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Navigation</title>
    <style>
        nav {
            display: flex;
            background: #222;
            padding: 15px;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>
</body>
</html>
