
<!DOCTYPE html>
<html>
<head>
    <title>Menu Hover</title>
    <style>
        nav {
            display: flex;
            gap: 20px;
            background: #222;
            padding: 15px;
        }
        nav a {
            color: white;
            padding: 8px;
            text-decoration: none;
        }
        nav a:hover {
            background: teal;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
</body>
</html>
