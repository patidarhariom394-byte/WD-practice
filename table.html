<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Table</title>
  <style>
    table{
      width: 100%;
      margin:20px;
      border-collapse: collapse;
    }
t
  th,td{
    text-align: left;
    border: 1px solid;
    padding: 10px;
  }

  thead{
    background-color: aquamarine;
  }

  tfoot{
    background-color: antiquewhite;
    font-weight: bold;
    text-align: center;
  }

  tbody{
    background-color: blanchedalmond;
  }
  </style>
</head>
<body>
  <table>
    <thead>
      <tr>
      <th>S.no.</th>
      <th>Name</th>
      <th>Class</th>
      <th>Roll no.</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <td>1.</td>
        <td>Hat</td>
        <td>!!th</td>
        <td>52</td>
      </tr>

      <tr>
        <td>2.</td>
        <td>Sat</td>
        <td>12th</td>
        <td>72</td>
      </tr>

      <tr>
        <td>3.</td>
        <td>Mat</td>
        <td>9th</td>
        <td>32</td>
      </tr>
    </tbody>

    <tfoot>
      <tr>
        <td colspan="2">Class Average</td>
        <td>12</td>
        <td>16</td>
      </tr>
    </tfoot>
  </table>
</body>
</html>
