
<!DOCTYPE html>
<html>
<head>
    <title>Padding Border Margin</title>
    <style>
        p {
            padding: 15px;
            border: 3px solid green;
            margin: 20px;
            background: #eeeeee;
        }
    </style>
</head>
<body>
    <p>Padding is inside the border; margin is outside it.</p>
</body>
</html>
