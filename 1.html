
<!DOCTYPE html>
<html>
<head>
    <title>Inline CSS Example</title>
</head>
<body style="background-color: lightyellow;">

    <h1 style="color: blue; text-align: center;">
        Welcome to Inline CSS
    </h1>

    <p style="color: green; font-size: 20px;">
        Inline CSS is used to style individual HTML elements.
    </p>

    <h2 style="color: red;">
        Web Development
    </h2>

    <p style="background-color: lightblue; padding: 10px;">
        This paragraph uses inline CSS for background color and padding.
    </p>

    <button style="background-color: blue; color: white; padding: 10px;">
        Click Me
    </button>

</body>
</html>
