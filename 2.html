
<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors</title>
    <style>
        p { color: navy; }                 /* Tag selector */
        .highlight { background: yellow; } /* Class selector */
        #main-title { color: red; }        /* ID selector */
    </style>
</head>
<body>
    <h1 id="main-title">CSS Selectors</h1>
    <p>This uses the tag selector.</p>
    <p class="highlight">This uses the class selector.</p>
</body>
</html>
